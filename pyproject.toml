[build-system]
# setuptools >= 77 is required for the PEP 639 license expression below.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-cf-tunnel"
version = "0.1.0"
description = "Serve the dsh Web UI through a Cloudflare quick tunnel, with a scannable terminal QR code"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["dsh", "deepseek-harness", "cloudflared", "quick-tunnel", "qr-code", "cli"]
authors = [{ name = "riteme", email = "riteme@qq.com" }]
urls = { Homepage = "https://github.com/riteme/dsh_cf_tunnel" }
dependencies = [
    "segno>=1.6",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.scripts]
dsh-cf-tunnel = "dsh_cf_tunnel.cli:main"

[project.optional-dependencies]
# The decode tests rasterize each terminal QR style back to a bitmap and read it
# with zxing-cpp, so the QR renderer is verified end to end rather than by eye.
dev = [
    "pytest>=7",
    "numpy>=1.24",
    "pillow>=10",
    "zxing-cpp>=2.2",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["dsh_cf_tunnel*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "e2e: boots a real quick tunnel, dsh, and cloudflared; opt in with DSH_CF_TUNNEL_E2E=1",
]

[tool.isort]
profile = "black"
line_length = 120
# Black owns vertical spacing (it collapses the two blank lines isort would insert
# before a __main__ guard or a module-level constant), so isort only sorts here.
lines_after_imports = -1

[tool.black]
line-length = 120
target-version = ["py39"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM", "RUF"]
